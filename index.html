<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RJNet Eventos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --bg: #0f0f0f;
        --surface: #1a1a1a;
        --surface2: #222222;
        --border: #2e2e2e;
        --text: #f0f0f0;
        --text-2: #b0b0b0;
        --text-3: #666666;
        --rj-blue: #f5c000;
        --rj-blue-light: #ffd740;
        --green: #22c55e;
        --green-bg: #052e16;
        --yellow: #f5c000;
        --red: #ef4444;
        --red-bg: #2d0b0b;
        --radius: 12px;
      }
      * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100%; }
      .mono { font-family: "DM Mono", monospace; }

      button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
      input, select, textarea {
        font-family: inherit; font-size: 14px;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px; width: 100%;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      input::placeholder, textarea::placeholder { color: var(--text-3); }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--rj-blue);
        box-shadow: 0 0 0 3px rgba(245,192,0,.18);
      }
      textarea { resize: vertical; }
      label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
      .field-group { margin-bottom: 14px; }
      .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      /* ---------- Buttons ---------- */
      .btn-primary {
        background: var(--rj-blue); color: #111; font-weight: 700;
        padding: 10px 18px; border-radius: 8px; font-size: 14px;
        transition: background .15s ease, transform .05s ease;
      }
      .btn-primary:hover { background: var(--rj-blue-light); }
      .btn-primary:active { transform: scale(.98); }
      .btn-full { width: 100%; }
      .btn-ghost {
        background: var(--surface2); color: var(--text-2);
        padding: 9px 16px; border-radius: 8px; font-weight: 500;
        box-shadow: 0 0 0 1px var(--border);
        transition: color .15s ease, background .15s ease;
      }
      .btn-ghost:hover { color: var(--text); background: #2a2a2a; }

      /* ---------- Login ---------- */
      .login-bg {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(900px 500px at 50% -10%, rgba(245,192,0,.07), transparent), var(--bg);
        padding: 24px;
      }
      .login-card {
        width: 100%; max-width: 380px; background: var(--surface);
        border: 1px solid var(--border); border-radius: 18px;
        padding: 36px 30px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
      }
      .login-logo { font-size: 38px; font-weight: 700; letter-spacing: -1px; text-align: center; }
      .logo-rj { color: var(--text); }
      .logo-net { color: var(--rj-blue); }
      .login-tag { text-align: center; color: var(--text-2); margin-top: 4px; font-size: 13px; }
      .login-sub { text-align: center; color: var(--text-3); margin: 2px 0 26px; font-size: 12px; }
      .login-form { display: flex; flex-direction: column; }
      .login-btn {
        background: var(--rj-blue); color: #111; font-weight: 700; font-size: 15px;
        padding: 13px; border-radius: 9px; margin-top: 6px; transition: background .15s ease;
      }
      .login-btn:hover { background: var(--rj-blue-light); }
      .error-msg { color: var(--red); font-size: 12px; margin-bottom: 10px; }
      .login-hint { text-align: center; color: var(--text-3); font-size: 11px; margin-top: 20px; }
      .vendedor-list { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 16px; }
      .vendedor-btn {
        display: flex; align-items: center; gap: 12px; text-align: left;
        background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
        padding: 12px 14px; font-size: 15px; font-weight: 500; color: var(--text);
        transition: border-color .15s ease, background .15s ease;
      }
      .vendedor-btn:hover { border-color: var(--rj-blue); background: var(--surface2); }
      .vendedor-avatar {
        width: 36px; height: 36px; border-radius: 50%; flex: 0 0 36px;
        background: var(--rj-blue); color: #111; font-weight: 700;
        display: flex; align-items: center; justify-content: center; font-size: 15px;
      }
      .back-btn { color: var(--text-2); font-size: 13px; transition: color .15s ease; }
      .back-btn:hover { color: var(--rj-blue); }

      /* ---------- Header ---------- */
      .app-header {
        position: sticky; top: 0; z-index: 50; height: 60px;
        display: flex; align-items: center; gap: 18px;
        padding: 0 22px; background: #111; border-bottom: 1px solid var(--border);
      }
      .header-logo { font-size: 21px; font-weight: 700; letter-spacing: -.5px; flex: 0 0 auto; }
      .header-nav { display: flex; gap: 4px; margin: 0 auto; }
      .nav-tab {
        display: flex; align-items: center; gap: 7px; padding: 8px 14px;
        color: var(--text-2); font-size: 14px; font-weight: 500; border-radius: 8px;
        border-bottom: 2px solid transparent; transition: color .15s ease;
      }
      .nav-tab:hover { color: var(--text); }
      .nav-tab.active { color: var(--rj-blue); border-bottom-color: var(--rj-blue); }
      .nav-tab svg { opacity: .8; }
      .nav-tab.active svg { opacity: 1; }
      .header-right { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
      .user-badge {
        display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2);
        background: var(--surface); padding: 6px 12px; border-radius: 999px; box-shadow: 0 0 0 1px var(--border);
      }
      .user-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

      /* ---------- Layout ---------- */
      .page { max-width: 1080px; margin: 0 auto; padding: 26px 22px 60px; }
      .page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
      .page-title { font-size: 22px; font-weight: 700; }
      .tab-desc { color: var(--text-2); font-size: 13px; margin-top: 2px; max-width: 560px; }
      .section { margin-top: 30px; }
      .section-title { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }

      /* ---------- Cards ---------- */
      .card {
        background: var(--surface); border-radius: var(--radius);
        box-shadow: 0 0 0 1px var(--border); padding: 16px;
      }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .grid-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
      .grid-kpi-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

      .kpi {
        background: var(--surface); border-radius: var(--radius);
        box-shadow: 0 0 0 1px var(--border); padding: 16px 18px;
        transition: box-shadow .15s ease;
      }
      .kpi:hover { box-shadow: 0 0 0 1px var(--rj-blue); }
      .kpi-label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
      .kpi-value { font-size: 28px; font-weight: 700; margin-top: 6px; font-family: "DM Mono", monospace; }
      .kpi.alert .kpi-value { color: var(--red); }

      /* ---------- Badges ---------- */
      .badge {
        display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
        padding: 3px 9px; border-radius: 999px; white-space: nowrap;
      }
      .badge-ativo { background: var(--green-bg); color: var(--green); }
      .badge-planejado { background: rgba(245,192,0,.12); color: var(--yellow); }
      .badge-encerrado { background: var(--surface2); color: var(--text-3); }
      .badge-tipo { background: rgba(245,192,0,.1); color: var(--rj-blue-light); }
      .badge-ok { background: var(--green-bg); color: var(--green); }
      .badge-warn { background: rgba(245,192,0,.12); color: var(--yellow); }
      .badge-crit { background: var(--red-bg); color: var(--red); }

      /* ---------- Chips ---------- */
      .chips { display: flex; gap: 8px; flex-wrap: wrap; }
      .chip {
        padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
        color: var(--text-2); box-shadow: 0 0 0 1px var(--border); background: var(--surface);
        transition: all .15s ease;
      }
      .chip:hover { color: var(--text); }
      .chip.active { background: var(--rj-blue); color: #111; font-weight: 700; box-shadow: none; }

      /* ---------- Event cards ---------- */
      .event-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .event-card {
        background: var(--surface); border-radius: var(--radius);
        box-shadow: 0 0 0 1px var(--border); padding: 18px; cursor: pointer;
        transition: box-shadow .15s ease, transform .05s ease;
        position: relative;
      }
      .event-card:hover { box-shadow: 0 0 0 1px var(--rj-blue); }
      .event-card .ev-name { font-size: 16px; font-weight: 700; padding-right: 80px; }
      .event-card .ev-status { position: absolute; top: 16px; right: 16px; }
      .ev-meta { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 7px; margin-top: 8px; }
      .ev-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
      .ev-leads { font-size: 13px; color: var(--text-2); }
      .ev-leads b { color: var(--text); font-family: "DM Mono", monospace; }
      .avatars { display: flex; }
      .avatars .av {
        width: 26px; height: 26px; border-radius: 50%; background: var(--surface2);
        box-shadow: 0 0 0 2px var(--surface); margin-left: -8px;
        display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text-2);
      }
      .avatars .av:first-child { margin-left: 0; }

      /* ---------- Tables ---------- */
      .tbl-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: 0 0 0 1px var(--border); }
      table { width: 100%; border-collapse: collapse; background: var(--surface); }
      th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      td { padding: 11px 14px; font-size: 13px; border-bottom: 1px solid var(--border); color: var(--text-2); }
      td.strong { color: var(--text); font-weight: 500; }
      tr:last-child td { border-bottom: none; }
      tbody tr { transition: background .12s ease; }
      tbody tr:hover { background: var(--surface2); }

      /* ---------- Filter rows ---------- */
      .filter-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      .filter-row select { width: auto; min-width: 180px; }

      /* ---------- Stock groups ---------- */
      .stock-group { margin-top: 22px; }
      .stock-group h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
      .stock-row {
        display: flex; align-items: center; gap: 14px; padding: 13px 16px;
        background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--border);
        margin-bottom: 8px; border-left: 3px solid var(--border);
      }
      .stock-row.crit { border-left-color: var(--red); }
      .stock-row.warn { border-left-color: var(--yellow); }
      .stock-row.ok { border-left-color: var(--green); }
      .stock-row .sr-main { flex: 1; min-width: 0; }
      .stock-row .sr-name { font-weight: 600; color: var(--text); }
      .stock-row .sr-desc { font-size: 12px; color: var(--text-3); }
      .stock-row .sr-num { text-align: center; font-size: 12px; color: var(--text-3); min-width: 56px; }
      .stock-row .sr-num b { display: block; font-size: 16px; color: var(--text); font-family: "DM Mono", monospace; }

      /* ---------- Vendor cards ---------- */
      .vendor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .vendor-card { background: var(--surface); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--border); padding: 18px; text-align: center; }
      .vendor-card .v-av {
        width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 12px;
        background: var(--rj-blue); color: #111; font-weight: 700; font-size: 22px;
        display: flex; align-items: center; justify-content: center;
      }
      .vendor-card .v-name { font-weight: 600; }
      .vendor-card .v-big { font-size: 34px; font-weight: 700; font-family: "DM Mono", monospace; margin: 8px 0 4px; }
      .vendor-card .v-cap { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
      .vendor-card .v-chart { height: 50px; margin-top: 12px; }
      .vendor-toggle { margin-top: 12px; }

      /* ---------- Detail view ---------- */
      .detail-hero { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 4px; }
      .detail-hero h1 { font-size: 24px; font-weight: 700; }
      .info-line { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
      .info-line:last-child { border-bottom: none; }
      .info-line .k { color: var(--text-3); min-width: 80px; }
      .info-line .v { color: var(--text); flex: 1; }
      .mini-stat { background: var(--surface2); border-radius: 10px; padding: 14px; text-align: center; }
      .mini-stat .ms-v { font-size: 26px; font-weight: 700; font-family: "DM Mono", monospace; }
      .mini-stat .ms-l { font-size: 12px; color: var(--text-2); margin-top: 2px; }

      /* ---------- Vendedor view ---------- */
      .vend-shell { max-width: 480px; margin: 0 auto; padding: 18px 16px 60px; }
      .vend-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
      .count-badge { background: var(--rj-blue); color: #111; font-weight: 700; padding: 5px 12px; border-radius: 999px; font-size: 13px; }
      .big-field input, .big-field textarea, .big-select select { padding: 14px; font-size: 16px; border-radius: 10px; }
      .big-field { margin-bottom: 16px; }
      .seg-control { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .seg-btn {
        padding: 13px 10px; border-radius: 10px; font-size: 14px; font-weight: 600;
        background: var(--bg); color: var(--text-2); box-shadow: 0 0 0 1px var(--border);
        transition: all .15s ease;
      }
      .seg-btn.active { background: var(--rj-blue); color: #111; box-shadow: none; }
      .lead-submit { height: 56px; font-size: 16px; }
      .meus-leads { margin-top: 28px; }
      .meus-leads h3 { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .05em; }
      .lead-mini { background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--border); padding: 12px 14px; margin-bottom: 8px; }
      .lead-mini .lm-name { font-weight: 600; }
      .lead-mini .lm-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

      /* ---------- Modal ---------- */
      .modal-overlay {
        position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.65);
        display: flex; align-items: center; justify-content: center; padding: 20px;
        backdrop-filter: blur(2px);
      }
      .modal-box { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.6); max-height: 90vh; overflow-y: auto; }
      .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
      .modal-header h2 { font-size: 17px; font-weight: 700; }
      .modal-close { color: var(--text-3); font-size: 18px; transition: color .15s ease; }
      .modal-close:hover { color: var(--text); }
      .modal-form { padding: 20px 22px; }
      .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

      .inline-form-card { background: var(--surface); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--border); padding: 18px; margin-bottom: 18px; }
      .empty { text-align: center; color: var(--text-3); padding: 40px 20px; font-size: 13px; }
      .chart-box { position: relative; height: 240px; }
      .chart-box.sm { height: 170px; }

      /* ---------- Light mode ---------- */
      .light {
        --bg: #f5f5f5;
        --surface: #ffffff;
        --surface2: #f0f0f0;
        --border: #e0e0e0;
        --text: #111111;
        --text-2: #555555;
        --text-3: #999999;
        --green-bg: #dcfce7;
        --red-bg: #fee2e2;
      }
      .light .app-header { background: #ffffff; }
      .light .login-bg { background: radial-gradient(900px 500px at 50% -10%, rgba(245,192,0,.12), transparent), #f5f5f5; }
      .light input, .light select, .light textarea { background: #ffffff; }
      .light .btn-ghost { background: #f0f0f0; }
      .light .btn-ghost:hover { background: #e4e4e4; }
      .light .bottom-nav { background: #ffffff; border-top-color: #e0e0e0; }

      /* ---------- Theme toggle button ---------- */
      .theme-toggle {
        width: 36px; height: 36px; border-radius: 8px; font-size: 17px;
        display: flex; align-items: center; justify-content: center;
        background: var(--surface2); box-shadow: 0 0 0 1px var(--border);
        transition: background .15s ease;
      }
      .theme-toggle:hover { background: var(--border); }

      /* ---------- Bottom nav (mobile) ---------- */
      .bottom-nav {
        display: none;
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
        height: 62px; background: var(--surface); border-top: 1px solid var(--border);
        padding: 0 8px; padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .bottom-nav-inner { display: flex; height: 62px; align-items: stretch; }
      .bn-tab {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; font-size: 10px; font-weight: 600; color: var(--text-3);
        border-top: 2px solid transparent; transition: color .15s ease;
        padding: 0 4px;
      }
      .bn-tab .bn-ico { font-size: 20px; line-height: 1; }
      .bn-tab.active { color: var(--rj-blue); border-top-color: var(--rj-blue); }

      @media (max-width: 760px) {
        .grid-kpi { grid-template-columns: repeat(2, 1fr); }
        .grid-kpi-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2, .event-grid { grid-template-columns: 1fr; }
        .vendor-grid { grid-template-columns: 1fr 1fr; }
        .field-row { grid-template-columns: 1fr; }

        /* Header: hide desktop nav, keep logo + actions */
        .header-nav { display: none; }
        .app-header { padding: 0 14px; gap: 10px; }
        .user-badge .ub-name { display: none; }

        /* Show bottom nav */
        .bottom-nav { display: block; }

        /* Add bottom padding so content isn't hidden behind bottom nav */
        .page { padding: 18px 14px 80px; }
        .vend-shell { padding: 16px 14px 80px; }

        /* Chips: scroll horizontal */
        .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { flex-shrink: 0; }

        /* Page head stacks on mobile */
        .page-head { flex-direction: column; align-items: flex-start; gap: 10px; }
        .page-head .btn-primary { align-self: stretch; text-align: center; }

        /* KPI values smaller on mobile */
        .kpi-value { font-size: 22px; }

        /* Stock rows: hide less critical columns */
        .sr-num { min-width: 40px; }
        .stock-row { gap: 10px; padding: 11px 12px; }

        /* Tables: min-width so they scroll */
        .tbl-wrap table { min-width: 480px; }

        /* Dashboard grid stacks */
        .dashboard-row { grid-template-columns: 1fr !important; }

        /* Detail hero */
        .detail-hero h1 { font-size: 19px; }
        .mini-stat .ms-v { font-size: 20px; }

        /* Segment control: 2x2 */
        .seg-control { grid-template-columns: 1fr 1fr; }

        /* Modal full screen on mobile */
        .modal-overlay { padding: 0; align-items: flex-end; }
        .modal-box { max-width: 100%; border-radius: 16px 16px 0 0; max-height: 92vh; }
      }

      @media (max-width: 400px) {
        .grid-kpi { grid-template-columns: 1fr 1fr; }
        .vendor-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useState, useContext, createContext, useEffect, useRef, useMemo } = React;

      /* ============================================================
         SVG ICON SYSTEM — stroke-based, geometric, clean
         ============================================================ */
      const Icon = ({ name, size = 16, stroke = "currentColor", strokeWidth = 1.6 }) => {
        const s = { width: size, height: size, display: "inline-block", verticalAlign: "middle", flexShrink: 0 };
        const p = { fill: "none", stroke, strokeWidth, strokeLinecap: "round", strokeLinejoin: "round" };
        const paths = {
          // Calendar
          calendar: <svg style={s} viewBox="0 0 24 24" {...p}><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>,
          // Box / Package

      function AppProvider({ children }) {

        const value = {
          materiais, eventos, leads, vendedores,
          addEvento: (e) => setEventos((p) => [...p, { ...e, id: "e" + Date.now(), criadoEm: new Date().toISOString() }]),
          updateEvento: (id, patch) => setEventos((p) => p.map((e) => (e.id === id ? { ...e, ...patch } : e))),
          addLead: (l) => setLeads((p) => [...p, { ...l, id: "l" + Date.now(), criadoEm: new Date().toISOString() }]),
          addMaterial: (m) => setMateriais((p) => [...p, { ...m, id: "m" + Date.now() }]),
          updateMaterial: (id, patch) => setMateriais((p) => p.map((m) => (m.id === id ? { ...m, ...patch } : m))),
          addVendedor: (nome) => setVendedores((p) => [...p, { id: "v" + Date.now(), nome, ativo: true }]),
          toggleVendedor: (id) => setVendedores((p) => p.map((v) => (v.id === id ? { ...v, ativo: !v.ativo } : v))),
          getLeadsEvento: (eid) => leads.filter((l) => l.eventoId === eid),
          getEventosAtivos: () => eventos.filter((e) => e.status === "ativo"),
          getMateriaisDisponiveis: () =>
            materiais.map((mat) => {
              const emCampo = eventos
                .filter((e) => e.status === "ativo" || e.status === "planejado")
                .flatMap((e) => e.materiais)
                .filter((mm) => mm.materialId === mat.id && !mm.retornado)
                .reduce((acc, mm) => acc + mm.quantidade, 0);
              return { material: mat, emCampo, disponivel: mat.quantidade - emCampo };
            }),
        };
        return <AppContext.Provider value={value}>{children}</AppContext.Provider>;

      function ChartView({ type, data, options }) {
        const ref = useRef(null);
        const inst = useRef(null);
        useEffect(() => {
          if (!ref.current) return;
          inst.current = new Chart(ref.current, {
            type,
            data,
            options: {
              responsive: true,
              maintainAspectRatio: false,
              ...options,
            },
          });
          return () => { if (inst.current) inst.current.destroy(); };
        }, [JSON.stringify(data), type, JSON.stringify(options)]);
        return <canvas ref={ref} />;
      }

        const vendoresDoEvento = (eid) => [...new Set(getLeadsEvento(eid).map((l) => l.vendedorNome))];

        return (
          <div className="page">
            <div className="page-head">
              <div className="chips">
                {["todos", "ativo", "planejado", "encerrado"].map((c) => (
                  <button key={c} className={"chip" + (filter === c ? " active" : "")} onClick={() => setFilter(c)}>
                    {c === "todos" ? "Todos" : STATUS_LABEL[c]}
                  </button>
                ))}
              </div>
              <button className="btn-primary" onClick={() => setShowModal(true)}>+ Novo Evento</button>
            </div>

            {filtered.length === 0 ? <div className="empty">Nenhum evento encontrado.</div> : (
              <div className="event-grid">
                {filtered.map((e) => {
                  const vs = vendoresDoEvento(e.id);
                  return (
                    <div key={e.id} className="event-card" onClick={() => onOpen(e.id)}>
                      <span className="ev-status"><StatusBadge s={e.status} /></span>
                      <div className="ev-name">{e.nome}</div>
                      <div className="ev-meta"><Icon name="pin" size={13} stroke="var(--text-3)" /> {e.local}</div>
                      <div className="ev-meta"><Icon name="calendar" size={13} stroke="var(--text-3)" /> {fmtDate(e.dataInicio)} – {fmtDate(e.dataFim)}</div>
                      <div style={{ marginTop: 10 }}><TipoBadge t={e.tipo} /></div>
                      <div className="ev-foot">
                        <span className="ev-leads"><Icon name="users" size={13} stroke="var(--text-3)" /> <b>{getLeadsEvento(e.id).length}</b> leads</span>
                        <div className="avatars">
                          {vs.slice(0, 4).map((n, i) => <div key={i} className="av">{initials(n)}</div>)}
                          {vs.length === 0 && <span style={{ fontSize: 12, color: "var(--text-3)" }}>—</span>}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            <Dashboard />
            {showModal && <EventModal onClose={() => setShowModal(false)} />}
          </div>
        );
      }

      /* ============================================================
         EVENT DETAIL VIEW
         ============================================================ */
      function EventDetail({ eventoId, onBack }) {
        const { eventos, materiais, getLeadsEvento, getMateriaisDisponiveis } = useApp();
        const ev = eventos.find((e) => e.id === eventoId);
        if (!ev) return null;
        const evLeads = getLeadsEvento(eventoId);
        const disp = getMateriaisDisponiveis();
        const matName = (id) => materiais.find((m) => m.id === id)?.nome || id;
        const emCampo = ev.materiais.filter((m) => !m.retornado).reduce((a, m) => a + m.quantidade, 0);

        const porVendedor = useMemo(() => {
          const c = {};
          evLeads.forEach((l) => { c[l.vendedorNome] = (c[l.vendedorNome] || 0) + 1; });
          return c;
        }, [evLeads]);

        const barData = {
          labels: Object.keys(porVendedor),
          datasets: [{ label: "Leads", data: Object.values(porVendedor), backgroundColor: "#f5c000", borderRadius: 6 }],
        };

        return (
          <div className="page">
            <button className="back-btn" onClick={onBack} style={{ marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}><Icon name="back" size={15} /> Voltar para Eventos</button>
            <div className="detail-hero">
              <h1>{ev.nome}</h1>
              <StatusBadge s={ev.status} />
              <TipoBadge t={ev.tipo} />
            </div>

            <div className="grid-2" style={{ marginTop: 18 }}>
              <div className="card">
                <div className="section-title">Informações</div>
                <div className="info-line"><span className="k">Local</span><span className="v" style={{ display:"flex", alignItems:"center", gap:5 }}><Icon name="pin" size={13} stroke="var(--text-3)" />{ev.local}</span></div>
                <div className="info-line"><span className="k">Datas</span><span className="v" style={{ display:"flex", alignItems:"center", gap:5 }}><Icon name="calendar" size={13} stroke="var(--text-3)" />{fmtDateLong(ev.dataInicio)} → {fmtDateLong(ev.dataFim)}</span></div>
                <div className="info-line"><span className="k">Observações</span><span className="v">{ev.observacoes || "—"}</span></div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div className="mini-stat"><div className="ms-v">{evLeads.length}</div><div className="ms-l">Leads captados</div></div>
                <div className="mini-stat"><div className="ms-v">{emCampo}</div><div className="ms-l">Materiais em campo</div></div>
              </div>
            </div>

            <div className="section">
              <div className="section-title">Materiais</div>
              {ev.materiais.length === 0 ? <div className="empty">Nenhum material vinculado.</div> : (
                <div className="tbl-wrap">
                  <table>
                    <thead><tr><th>Material</th><th>Qtd. Saída</th><th>Estoque Total</th><th>Disponível</th></tr></thead>
                    <tbody>
                      {ev.materiais.map((m, i) => {
                        const d = disp.find((x) => x.material.id === m.materialId);
                        const dv = d ? d.disponivel : 0;
                        const cls = dv <= 0 ? "crit" : dv <= 3 ? "warn" : "ok";
                        return (
                          <tr key={i}>
                            <td className="strong">{matName(m.materialId)}</td>
                            <td>{m.quantidade}</td>
                            <td>{d ? d.material.quantidade : "—"}</td>
                            <td><span className={"badge badge-" + cls}>{dv}</span></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            <div className="section">
              <div className="section-title">Leads Captados</div>
              {evLeads.length === 0 ? <div className="empty">Nenhum lead captado neste evento.</div> : (
                <>
                  <div className="card" style={{ marginBottom: 16 }}>
                    <div className="section-title">Leads por Vendedor</div>
                    <div className="chart-box sm">
                      <ChartView type="bar" data={barData} options={{
                        plugins: { legend: { display: false } },
                        scales: darkScale,
                      }} />
                    </div>
                  </div>
                  <div className="tbl-wrap">
                    <table>
                      <thead><tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th>Serviço</th><th>Vendedor</th></tr></thead>
                      <tbody>
                        {evLeads.map((l) => (
                          <tr key={l.id}>
                            <td className="strong">{l.nome}</td>
                            <td className="mono">{l.telefone}</td>
                            <td>{l.endereco}</td>
                            <td><span className="badge badge-tipo">{servicoLabel(l.servicoInteresse)}</span></td>
                            <td>{l.vendedorNome}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </div>
          </div>
        );
      }

      /* ============================================================
         ESTOQUE TAB
         ============================================================ */
      function EstoqueTab() {
        const { getMateriaisDisponiveis } = useApp();
        const [showModal, setShowModal] = useState(false);
        const list = getMateriaisDisponiveis();
        const totalItens = list.reduce((a, m) => a + m.material.quantidade, 0);
        const emCampo = list.reduce((a, m) => a + m.emCampo, 0);
        const crit = list.filter((m) => m.disponivel <= 0);
        const warn = list.filter((m) => m.disponivel >= 1 && m.disponivel <= 3);
        const ok = list.filter((m) => m.disponivel >= 4);

        const Group = ({ title, dot, cls, rows }) => rows.length === 0 ? null : (
          <div className="stock-group">
            <h3><Icon name={dot} size={10} /> {title} <span style={{ color: "var(--text-3)", fontWeight: 400 }}>({rows.length})</span></h3>
            {rows.map((m) => (
              <div key={m.material.id} className={"stock-row " + cls}>
                <div className="sr-main">
                  <div className="sr-name">{m.material.nome}</div>
                  <div className="sr-desc">{m.material.descricao || "Sem descrição"}</div>
                </div>
                <div className="sr-num"><b>{m.material.quantidade}</b>total</div>
                <div className="sr-num"><b>{m.emCampo}</b>em campo</div>
                <div className="sr-num">
                  <span className={"badge badge-" + (cls === "crit" ? "crit" : cls === "warn" ? "warn" : "ok")}>{m.disponivel} disp.</span>
                </div>
              </div>
            ))}
          </div>
        );

        return (
          <div className="page">
            <div className="page-head">
              <div>
                <div className="page-title">Estoque</div>
                <p className="tab-desc">Controle de materiais e disponibilidade em tempo real.</p>
              </div>
              <button className="btn-primary" onClick={() => setShowModal(true)}>+ Adicionar Material</button>
            </div>

            <div className="grid-kpi-3">
              <Kpi label="Total Tipos" value={list.length} icon="box" />
              <Kpi label="Total Itens" value={totalItens} icon="🔢" />
              <Kpi label="Em Campo" value={emCampo} icon="🚚" />
            </div>

            <Group title="CRÍTICO" dot="dot_red" cls="crit" rows={crit} />
            <Group title="ATENÇÃO" dot="dot_yellow" cls="warn" rows={warn} />
            <Group title="OK" dot="dot_green" cls="ok" rows={ok} />

            {showModal && <MaterialModal onClose={() => setShowModal(false)} />}
          </div>
        );
      }

      /* ============================================================
         EQUIPE TAB
         ============================================================ */
      function EquipeTab() {
        const { vendedores, leads, eventos, addVendedor, toggleVendedor } = useApp();
        const [showForm, setShowForm] = useState(false);
        const [nome, setNome] = useState("");

        const submit = (e) => {
          e.preventDefault();
          if (nome.trim()) { addVendedor(nome.trim()); setNome(""); setShowForm(false); }
        };

        const leadsDoVendedor = (n) => leads.filter((l) => l.vendedorNome === n);

        return (
          <div className="page">
            <div className="page-head">
              <div>
                <div className="page-title">Equipe</div>
                <p className="tab-desc">Gerencie os perfis da equipe comercial. Vendedores ativos aparecem na tela de login do acesso Comercial.</p>
              </div>
              <button className="btn-primary" onClick={() => setShowForm((s) => !s)}>+ Adicionar Vendedor</button>
            </div>

            {showForm && (
              <form onSubmit={submit} className="inline-form-card">
                <div className="field-group">
                  <label>Nome completo *</label>
                  <input required value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Ex: Pedro Souza" autoFocus />
                </div>
                <div className="modal-actions">
                  <button type="button" className="btn-ghost" onClick={() => setShowForm(false)}>Cancelar</button>
                  <button type="submit" className="btn-primary">Adicionar</button>
                </div>
              </form>
            )}

            <div className="vendor-grid">
              {vendedores.map((v) => {
                const vl = leadsDoVendedor(v.nome);
                const recent = [...eventos]
                  .sort((a, b) => a.dataInicio.localeCompare(b.dataInicio))
                  .slice(-5)
                  .map((ev) => ({ ev, n: vl.filter((l) => l.eventoId === ev.id).length }));
                const hasData = recent.some((r) => r.n > 0);
                const barData = {
                  labels: recent.map((r) => fmtDate(r.ev.dataInicio)),
                  datasets: [{ data: recent.map((r) => r.n), backgroundColor: "#f5c000", borderRadius: 4 }],
                };
                return (
                  <div key={v.id} className="vendor-card">
                    <div className="v-av">{initials(v.nome)}</div>
                    <div className="v-name">{v.nome}</div>
                    <div className="v-big">{vl.length}</div>
                    <div className="v-cap">leads captados</div>
                    <div style={{ marginTop: 8 }}>
                      <span className={"badge " + (v.ativo ? "badge-ativo" : "badge-encerrado")}>{v.ativo ? "Ativo" : "Inativo"}</span>
                    </div>
                    {hasData && (
                      <div className="v-chart">
                        <ChartView type="bar" data={barData} options={{
                          plugins: { legend: { display: false }, tooltip: { enabled: true } },
                          scales: { x: { display: false }, y: { display: false, beginAtZero: true } },
                        }} />
                      </div>
                    )}
                    <button className="btn-ghost vendor-toggle" onClick={() => toggleVendedor(v.id)}>
                      {v.ativo ? "Desativar" : "Ativar"}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      /* ============================================================
         VENDEDOR (COMERCIAL) VIEW — mobile-first
         ============================================================ */
      function VendedorApp({ session, onLogout, darkMode, toggleDark }) {
        const { getEventosAtivos, addLead, leads } = useApp();
        const ativos = getEventosAtivos();
        const [eventoId, setEventoId] = useState(ativos[0]?.id || "");
        const [f, setF] = useState({ nome: "", telefone: "", endereco: "", servicoInteresse: "fibra_residencial", observacao: "" });
        const set = (k, v) => setF((p) => ({ ...p, [k]: v }));

        const meusLeadsHoje = leads.filter((l) => {
          const hoje = new Date().toDateString();
          return l.vendedorNome === session.vendedorNome && new Date(l.criadoEm).toDateString() === hoje;
        });

        const submit = (e) => {
          e.preventDefault();
          if (!eventoId) return;
          addLead({ ...f, eventoId, vendedorNome: session.vendedorNome });
          setF({ nome: "", telefone: "", endereco: "", servicoInteresse: "fibra_residencial", observacao: "" });
        };

        return (
          <div>
            <header className="app-header">
              <div className="header-logo"><span className="logo-rj">RJ</span><span className="logo-net">NET</span></div>
              <div className="header-right" style={{ marginLeft: "auto" }}>
                <button className="theme-toggle" onClick={toggleDark} title="Alternar tema"><Icon name={darkMode ? "sun" : "moon"} size={17} /></button>
                <span className="user-badge"><span className="vendedor-avatar" style={{ width: 22, height: 22, fontSize: 11 }}>{session.vendedorNome.charAt(0)}</span><span className="ub-name">{session.vendedorNome}</span></span>
              </div>
              <button className="btn-ghost" onClick={onLogout}>Sair</button>
              </div>
            </header>

            <div className="vend-shell">
              <div className="vend-top">
                <h1 style={{ fontSize: 20, fontWeight: 700 }}>Registrar Lead</h1>
                <span className="count-badge">{meusLeadsHoje.length} hoje</span>
              </div>

              <div className="big-field big-select">
                <label>Evento</label>
                {ativos.length === 0 ? (
                  <div className="empty" style={{ textAlign: "left", padding: "10px 0" }}>Nenhum evento ativo no momento.</div>
                ) : (
                  <select value={eventoId} onChange={(e) => setEventoId(e.target.value)}>
                    {ativos.map((e) => <option key={e.id} value={e.id}>{e.nome}</option>)}
                  </select>
                )}
              </div>

              {ativos.length > 0 && (
                <form onSubmit={submit}>
                  <div className="big-field">
                    <label>Nome completo *</label>
                    <input required value={f.nome} onChange={(e) => set("nome", e.target.value)} placeholder="Nome do cliente" />
                  </div>
                  <div className="big-field">
                    <label>Telefone *</label>
                    <input required value={f.telefone} onChange={(e) => set("telefone", e.target.value)} placeholder="(24) 99999-9999" inputMode="tel" />
                  </div>
                  <div className="big-field">
                    <label>Endereço</label>
                    <input value={f.endereco} onChange={(e) => set("endereco", e.target.value)} placeholder="Rua, número, bairro" />
                  </div>
                  <div className="big-field">
                    <label>Serviço de interesse *</label>
                    <div className="seg-control">
                      {Object.keys(SERVICO_LABEL).map((s) => (
                        <button type="button" key={s} className={"seg-btn" + (f.servicoInteresse === s ? " active" : "")} onClick={() => set("servicoInteresse", s)}>
                          {SERVICO_LABEL[s]}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="big-field">
                    <label>Observação</label>
                    <textarea rows="2" value={f.observacao} onChange={(e) => set("observacao", e.target.value)} placeholder="Informações adicionais sobre o cliente..." />
                  </div>
                  <button type="submit" className="btn-primary btn-full lead-submit">Registrar Lead</button>
                </form>
              )}

              {meusLeadsHoje.length > 0 && (
                <div className="meus-leads">
                  <h3>Meus Leads Hoje</h3>
                  {meusLeadsHoje.map((l) => (
                    <div key={l.id} className="lead-mini">
                      <div className="lm-name">{l.nome}</div>
                      <div className="lm-sub">{l.telefone} · {servicoLabel(l.servicoInteresse)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ============================================================
         ROOT
         ============================================================ */
      function Root() {
        const [session, setSession] = useState(null);
        const [darkMode, setDarkMode] = useState(() => {
          const saved = localStorage.getItem("rjnet-theme");
          return saved ? saved === "dark" : true;
        });

        useEffect(() => {
          document.documentElement.classList.toggle("light", !darkMode);
          localStorage.setItem("rjnet-theme", darkMode ? "dark" : "light");
        }, [darkMode]);

        const toggleDark = () => setDarkMode((d) => !d);
        const logout = () => setSession(null);

        if (!session) return <Login onLogin={setSession} darkMode={darkMode} toggleDark={toggleDark} />;
        if (session.role === "marketing") return <MarketingApp session={session} onLogout={logout} darkMode={darkMode} toggleDark={toggleDark} />;
        return <VendedorApp session={session} onLogout={logout} darkMode={darkMode} toggleDark={toggleDark} />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <AppProvider><Root /></AppProvider>
      );
    </script>
  </body>
</html>
